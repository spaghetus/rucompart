[package]
name = "rucompart"
version = "0.1.0"
edition = "2024"

[dependencies]
fork = "0.6.0"
futures = "0.3.31"
libc = "0.2.181"
netdev = "0.42.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tarpc = { version = "0.37.0", features = [
    "serde-transport",
    "serde-transport-json",
    "unix",
] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[features]
standalone = []

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dashmap = { version = "6.1.0", features = ["rayon"] }
eyre = "0.6.12"
rayon = "1.12.0"
rhai = { version = "1.24.0", features = [
    "serde",
    "sync",
    "std",
], default-features = false }
rocket = { version = "0.5.1", features = ["json"] }
serde_json = "1.0.149"
